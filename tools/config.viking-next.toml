[repo]
root_path = ".."
data_path = "data"
build_path = "build"
file_list = "uking_functions.csv"
data_symbols = ["data_symbols.csv"]
build_target = "uking"
toolchain_bin_paths = ["toolchain/bin"]

[check_mismatch]
check_unimplemented_references = false

[check_mismatch.asm_differ]
source_directories = ["src", "lib"]

[decomp_me]
compiler_name = "clang-4.0.1"
default_compile_flags = "-x c++ -O3 -g2 -std=c++1z -fno-rtti -fno-exceptions -Wall -Wextra -fno-strict-aliasing"


